version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "zone.js"
          - "typescript"
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "typescript"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
